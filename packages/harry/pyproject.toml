[project]
name = "harry"
version = "0.1.0"
description = "Harry's core: the registry, the MCP server, the scheduler, the store and the HTTP app"
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "fastmcp>=2.0",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "pyyaml>=6.0",          # module.yaml

    # Modules. Pinned loosely here; the two that break are pinned hard below.
    "caldav>=3.3",          # iCloud calendar and Reminders
    "trafilatura>=2.0",     # tier-1 article extraction
    "playwright>=1.49",     # tier-2 article extraction, for sites that block scripts
    "weasyprint>=63",       # HTML + CSS to PDF, with a real outline
    "slack-bolt>=1.21",     # Socket Mode
    "remarkapy>=0.2",       # reMarkable cloud push. rmapy and rmcl are archived and dead.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harry"]
