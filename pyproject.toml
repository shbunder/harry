# Harry — one package, at src/harry.
#
# Not a uv workspace. That existed so the contract could "grow sideways" into a second
# package, and it never will: a capability is a folder under `.harry/`, discovered at
# run time, not a package resolved at install time. What it actually bought was a path
# four directories deep with the word harry in it three times.

[project]
name = "harry"
version = "0.1.0"
description = "Harry — a companion service that does what Claude decides"
requires-python = ">=3.12"
dependencies = [
    # Core
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "fastmcp>=2.0",
    "apscheduler>=3.11",
    "httpx>=0.28",
    "pyyaml>=6.0",

    # What the capabilities need. Common ones live here; a capability adds its own
    # only when it needs something exotic.
    "caldav>=3.3",          # iCloud calendar and reminders
    "trafilatura>=2.0",     # article text extraction
    "playwright>=1.49",     # for sites that block scripted clients
    "weasyprint>=63",       # HTML + CSS to PDF, with a real outline
    "markdown-it-py>=3.0",  # markdown to HTML, on the way to a PDF the tablet can read
    # EXACT, not a range. The reMarkable protocol is reverse-engineered and a release
    # broke every write in August 2026. 0.3.1 is the version that paired, pushed, and was
    # confirmed on the device. Move it deliberately, then run
    # `make test-live ARGS=tests/test_remarkable_connector.py` against a real tablet.
    # rmapy and rmcl are archived and dead; the Go rmapi binary is not needed — remarkapy
    # pairs on its own with register_device(code).
    "remarkapy==0.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harry"]

[dependency-groups]
# The gate's own tools. Installed by `make env-install`, never by the container.
dev = [
    "ruff>=0.14",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "coverage[toml]>=7.6",
    "respx>=0.22",           # httpx mocking, so feed tests never touch a live URL
]

# ============================================================================
# ruff — formatter and linter
# ============================================================================
[tool.ruff]
target-version = "py312"
line-length = 120
# `tests/fixtures` is excluded for the same reason `pyrightconfig.json` excludes it:
# the point of half those capabilities is that they do not work, and one of them does
# not parse at all. They are input to the loader, not part of the program.
exclude = [".git", ".ruff_cache", ".pytest_cache", ".venv", "__pycache__", "build", "dist", "site", "scratch", "tests/fixtures"]
# Where first-party modules live. `project` and `scripts` are on pytest's pythonpath,
# so `import board` is first-party however it looks from the repo root.
src = ["src", "project", "scripts", ".harry"]

[tool.ruff.lint]
select = [
    "A",    # shadowing built-ins
    "C901", # cyclomatic complexity
    "E",    # pycodestyle
    "ERA",  # commented-out code
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "T100", # stray breakpoints
]
ignore = [
    "E501", # line-too-long — the formatter owns line length
    "N818", # error-suffix-for-exceptions
]

[tool.ruff.lint.mccabe]
# A ratchet: it only ever falls. Raising it to make a function fit is the move
# .claude/rules/debugging.md forbids.
max-complexity = 12

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["harry"]

[tool.ruff.format]
quote-style = "single"

# ============================================================================
# pytest
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# --import-mode=importlib so two test files may share a basename in different
# directories without colliding on module name, and tests/ needs no __init__.py.
#
# `-m "not live"` is here rather than only in the Makefile because a bare
# `pytest tests/test_remarkable_connector.py` would otherwise push a real document to a
# real tablet — which is how seven copies of a test page ended up on one. A later `-m`
# on the command line overrides this, which is what `make test-live` passes.
addopts = "--strict-markers --strict-config --import-mode=importlib -m 'not live'"
pythonpath = [".", "scripts", "project"]
# `.harry` is deliberately absent here: its Python is loaded by Harry at run time, by
# path, not imported by name. Adding it would let a test import a connector directly and
# pass while the real loader was broken.
markers = [
    # Reaches the network. Never run by `make check` — feed and article parsing is
    # tested against recorded fixtures, per .claude/rules/external-sources.md.
    "live: reaches a real external service",
    "slow: takes more than a second",
]
filterwarnings = ["error::DeprecationWarning:harry.*"]

# ============================================================================
# coverage
# ============================================================================
[tool.coverage.run]
branch = true
source = ["src/harry", "project", "scripts", ".harry"]
omit = ["*/tests/*", "*/scratch/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
# A ratchet, like max-complexity above it, and it only ever rises. Lowering this
# to make the gate green is a Critical finding — .claude/rules/debugging.md.
#
# 80 -> 85: opened at 80 before anything was written, raised once the scaffolding
# measured 88. Three points of headroom, deliberately: unlike max-complexity, this
# number is global, so a feature elsewhere can push it down without touching the
# code you are looking at. Sitting exactly at the ceiling turns that into a red
# gate on somebody else's change.
fail_under = 85
show_missing = true
skip_covered = true
