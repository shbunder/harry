# Harry on the NUC. Two stacks, two volumes, two ports.
#
# Marcel owns 7420 and 7421. Harry owns 7430, and its dev stack 7431.

# Pinned, because compose otherwise names the project after the directory it is run from —
# and that name prefixes the volumes. From a worktree the store would be
# `2a6ce1_harry-data` instead of `harry_harry-data`: `make up` would come up healthy on an
# empty volume, with yesterday's page and the watchdog's memory still sitting in the other
# one, and nothing would say so.
name: harry

services:
  harry:
    build: .
    # The real stack names a tag. `make deploy` sets HARRY_TAG to the commit it built, and
    # `make rollback` sets it to the one before — so what is running is a version somebody
    # chose rather than whatever `latest` last pointed at. The fallback is what makes a
    # first `make up` work on a machine that has never deployed.
    image: harry:${HARRY_TAG:-latest}
    container_name: harry
    restart: unless-stopped
    depends_on:
      - harry-browser
    # A small init as PID 1, which reaps what a crashed Chromium leaves behind — `uv` does not,
    # and a container running for months would collect them — and passes `docker stop` on.
    init: true
    # Both files, in the same order and with the same meaning as everywhere else:
    # `.env` is committed and carries the defaults, `.env.local` is this NUC's and wins.
    # `required: false` because a machine with nothing to override needs no second file.
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    ports:
      - "7430:7430"
    volumes:
      # SQLite, rendered pages, cached articles, and the De Tijd session.
      - harry-data:/data
      # Each capability's own `.env.local`, where the operator keeps its credentials —
      # `.harry/connectors/icloud/.env.local` and so on. The image carries none, so the real
      # stack reads them from the checkout, read-only, and nothing but `.env.local` is read
      # from here: the code that runs is still the image's. A mount rather than a second copy
      # of every credential under its prefixed name in the root `.env.local`, because two
      # copies of a password disagree the first time only one of them is changed.
      - type: bind
        source: ./.harry
        target: /settings
        read_only: true
      # Nothing else of yours is mounted here. Harry never calls a model, so it needs no
      # provider credential — see .claude/rules/no-model-calls.md.
    environment:
      # Europe/Brussels matters: the 06:30 job is a local time, not a UTC one.
      TZ: Europe/Brussels
      # These two are set here, not left to the env files, because `environment:` outranks
      # `env_file:` — which is what stops a stray key in someone's .env.local moving the
      # port Harry listens on away from the port published above. That failure reports
      # itself as healthy, because the image's healthcheck reads the same HARRY_PORT and
      # follows it to the wrong place, so there is nothing to notice from outside.
      HARRY_PORT: 7430
      HARRY_DATA_DIR: /data
      # The real stack keeps the clock. Only one Harry on this machine may.
      HARRY_SCHEDULER_ENABLED: "true"
      # Where the browser lives. Set here rather than in the connector's file because it is
      # deployment, not a credential: on a laptop it is empty and the connector starts a browser
      # of its own. A wrong value reads as a browser that could not start, and says so.
      HARRY_TIJD_BROWSER_ENDPOINT: ws://harry-browser:3000/
      # Where the mount above lands. Set here rather than in a file for the same reason as
      # the port: a stray value in `.env.local` must not be able to point it elsewhere.
      HARRY_CAPABILITY_SETTINGS_DIR: /settings

  # The browser De Tijd is read with, and nothing else. It renders a commercial news site, ads
  # and all, so it is the one container here that meets hostile input — and it is given nothing:
  # no `.harry/` mount, no root `.env.local`, no data volume, no published port. An exploited
  # renderer lands somewhere empty. Decided in project/decisions/, the day De Tijd shipped.
  harry-browser:
    image: harry:${HARRY_TAG:-latest}
    container_name: harry-browser
    restart: unless-stopped
    init: true
    # Unprivileged, and with Chromium's own sandbox on — which needs Docker's syscall filtering
    # relaxed, measured. That relaxation is safe to make HERE and nowhere else: this container
    # holds nothing. Anything added to it has to revisit that.
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - seccomp:unconfined
      # The sandbox needs the syscall filtering above relaxed, which widens what an escape from
      # this container could try next. These three are the cheap half of that back: no process
      # here may gain privileges, the filesystem is a tmpfs it cannot keep anything in, and a
      # fork bomb in a renderer stops at 512.
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 512
    # Its own, because the image's asks Harry's port for /health and nothing here answers that —
    # a container that is permanently unhealthy is one nobody reads the health of.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 3000), 2).close()"]
      interval: 60s
      timeout: 5s
      start_period: 20s
    # No env_file and no volumes, on purpose. Both are checked by the suite.
    environment:
      TZ: Europe/Brussels
      # Its filesystem is read-only, so what it scratches goes to the tmpfs that dies with it.
      # Not configuration Harry reads — it keeps the browser off disk.
      HOME: /tmp
    # Reachable on the compose network by name, never published.
    # The installed binary, not `uv run`: uv rewrites the editable install on start, and this
    # container's filesystem is read-only. Nothing here needs a resolver.
    command: ["/app/.venv/bin/playwright", "run-server", "--port", "3000", "--host", "0.0.0.0"]

  # The stack a change is tried on. Same image, same code, different everything else.
  # `profiles:` is what keeps it out of a plain `make up` — compose ignores a profiled
  # service unless it is asked for by name, so starting dev is always deliberate.
  # Decided in project/decisions/: one image, two compose profiles, not two images.
  harry-dev:
    profiles: [dev]
    build: .
    # Dev tracks `latest` on purpose: it is where the newest build is tried, and pinning it
    # would mean two things to move for every change instead of one.
    image: harry:latest
    container_name: harry-dev
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: true
      # NOT .env.local. The dev stack has its own credentials, so that a token pasted here
      # to try something cannot be the one the morning page is using. For the same reason it
      # does not mount `.harry/` the way the real stack does: every connector's `.env.local`
      # there is the real one. Dev's go in this file, under their prefixed names.
      - path: .env.dev.local
        required: false
    ports:
      - "7431:7431"
    volumes:
      # Its own volume. `docker compose down -v` on dev cannot take the real store with it.
      - harry-dev-data:/data
    environment:
      TZ: Europe/Brussels
      HARRY_PORT: 7431
      HARRY_DATA_DIR: /data
      # The one real asymmetry between the two stacks, and the reason there are two.
      # Two schedulers would both watch morning-page's 07:00 deadline, and this one would
      # report a miss for a page the real stack delivered — which is how the channel that
      # carries actual failures stops being read. A stack with this off schedules nothing,
      # registers no watchdog, and says `"enabled": false` under `jobs` in /health.
      HARRY_SCHEDULER_ENABLED: "false"

volumes:
  harry-data:
  harry-dev-data:
